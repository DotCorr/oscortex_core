# core/boot-uefi/limine.conf
#
# Limine 12 menu for the hybrid ISO (ADR-0060 UEFI/OVMF, ADR-0072
# BIOS/SeaBIOS). Same file, both firmwares. protocol: multiboot
# (Multiboot1) so boot.S's existing _start still runs: 32-bit
# protected mode, EAX magic, EBX info, long-mode transition unchanged.
# The Limine protocol would jump to a 64-bit entry and skip that stub;
# do not switch without a second entry point.
#
# resolution is 1024x768x32 on purpose: not the kernel's compiled-in
# Bochs mode (800x600) and not QEMU virtio-vga's default (1280x800).
# p2-gop/run.sh writes the same numbers into the image it builds and
# requires the kernel's FB GOP line to match, so a kernel that printed
# 800x600 from dispi cannot pass the UEFI boot.

timeout: 0

/oscortex
    protocol: multiboot
    path: boot():/boot/kernel.elf
    resolution: 1024x768x32
